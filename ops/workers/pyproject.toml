[project]
name = "evv-workers"
version = "0.1.0"
description = "eevolvv clipping pipeline workers"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "httpx>=0.28",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "moto[s3,server]>=5.0",
  "mypy>=1.14",
  "pytest>=8.3",
  "respx>=0.22",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evv_workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["evv_workers"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "cv2", "cv2.*", "yaml", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
