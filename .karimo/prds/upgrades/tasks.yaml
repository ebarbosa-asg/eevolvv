      1. Extract `domain` from request body (add to destructuring, optional field).

      2. In parallel (Promise.allSettled), call:
         - `fetch(\`\${req.nextUrl.origin}/api/seo-audit\`, { method: 'POST', body: JSON.stringify({ domain, businessName, industry }) })`
         - `fetch(\`\${req.nextUrl.origin}/api/ad-health\`, { method: 'POST', body: JSON.stringify({ businessType, industry, topPains, revenue, teamSize }) })`

      3. Parse responses (handle failures gracefully — both are optional enrichments).

      4. Append to rawReport BEFORE the STATS block:
         ```
         ### AD HEALTH
         SCORE: {score ?? 'N/A'}
         {findings as bullet list}
         RECOMMENDATION: {recommendation}

         ### SEO AUDIT
         SCORE: {score ?? 'N/A'}
         DOMAIN: {domain ?? 'not provided'}
         {findings as bullet list}
         RECOMMENDATION: {recommendation}
         ```

      5. Store scores in Supabase:
         ```ts
         await supabase?.from('submissions').update({
           ad_health_score: adHealth?.score ?? null,
           seo_score: seoAudit?.score ?? null,
           seo_domain: domain ?? null,
         }).eq('id', submissionId)
         ```
         (This update can fail silently — wrap in try/catch.)

      6. Include `adHealthScore` and `seoScore` in the final JSON response.

      IMPORTANT: The seo-audit + ad-health calls must NOT block the main response.
      Use a 10-second timeout on both parallel calls. If they exceed timeout, append
      placeholder sections with score "N/A".
    files_to_modify:
      - "app/api/diagnostic/route.ts"
    depends_on: ["2a-1", "2a-2"]
    acceptance_criteria:
