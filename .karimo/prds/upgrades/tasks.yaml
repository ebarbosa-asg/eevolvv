  - id: "3a-2"
    wave: 5
    title: "Build app/api/video-summary/route.ts — generate HTML scenes + render via HyperFrames"
    model: opus
    complexity: 5
    description: |
      Create `app/api/video-summary/route.ts` as a POST endpoint.

      Request body: `{ submissionId: string }`

      Step 1 — Fetch submission data:
      Query Supabase: `business_name, report, tier, email, ad_health_score, seo_score`
      Parse stats from report text (re-use the STATS block parser pattern from diagnostic/route.ts).
      Parse top 3 automation opportunities from the `### TOP AUTOMATION OPPORTUNITIES` section
      (extract first 3 items).

      Step 2 — Generate video HTML via Claude:
      Use claude-sonnet-4-6 to generate a complete single-file HTML document with 5 scenes.

      System prompt:
      "You are a motion designer creating HTML/CSS/JS for HyperFrames video rendering.
      Generate a single HTML file with 5 timed scenes (total 60 seconds).
      Use eevolvv brand: background #141413 (ink), accent #8C2B1A (brick red), text #faf7f0 (paper).
      Font: Space Grotesk (load from Google Fonts). No external images.
      Each scene should animate in with CSS transitions. Use data-scene attributes.
      Return ONLY the HTML document, no explanation."

      User prompt: Include businessName, automations array (3 items), stats (hoursFreed,
      automations count, annualSavings), tier, and Stripe checkout URL
      (`process.env.NEXT_PUBLIC_BASE_URL + '/pricing'`).

      Video scene structure:
        Scene 1 (0-5s):   Business name large text + "Evolution Report" subtext
        Scene 2 (5-20s):  "Top 3 Automation Opportunities" — each reveal with 4s delay
        Scene 3 (20-35s): Stat callouts — hours freed, automations, annual savings (counter animation)
        Scene 4 (35-55s): "Ready to build it?" headline + Stripe URL as visible text CTA
        Scene 5 (55-60s): eevolvv wordmark + eevolvv.com

      Step 3 — Render to video:
      Check `process.env.HYPERFRAMES_RENDER_URL`:
        - If set: POST the HTML to that URL, receive MP4 binary or URL
        - If not set: use HyperFrames npm package subprocess:
          ```
          import { renderHtml } from '@heygen/hyperframes'
          const mp4Buffer = await renderHtml(htmlString, { duration: 60, width: 1280, height: 720 })
          ```
          (Install @heygen/hyperframes; handle if package unavailable — return error)

      Step 4 — Store video:
      Upload MP4 to Supabase Storage bucket `report-videos`:
        - Path: `{submissionId}/summary.mp4`
        - Bucket must be public-read
        - Get public URL from Supabase Storage
      Update `submissions.video_url` with the public URL.

      Step 5 — Return:
      `{ success: true, videoUrl: string }`

      Error handling:
        - Missing submission: 404
        - Claude generation failure: 502
        - HyperFrames render failure: 502 with `{ error: 'render_failed' }`
        - Supabase storage failure: return video as base64 data URL as fallback

      Timeout: 90 seconds total (HyperFrames render can be slow).
    files_to_create:
      - "app/api/video-summary/route.ts"
    depends_on: ["db-migration", "3a-1"]
    acceptance_criteria:
      - "Fetches submission and parses stats correctly"
      - "Generates HTML via Claude"
      - "Handles HYPERFRAMES_RENDER_URL env var (falls back to npm package)"
      - "Stores video in Supabase Storage and updates submissions.video_url"
      - "Returns { success, videoUrl }"
      - "90s timeout enforced"
      - "`npm run build` passes"

