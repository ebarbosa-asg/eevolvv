  # ── Wave 3: Ad Health + SEO Audit ────────────────────────────────────────

  - id: "2a-1"
    wave: 3
    title: "Build app/api/seo-audit/route.ts — domain-only public SEO checks"
    model: opus
    complexity: 5
    description: |
      Create `app/api/seo-audit/route.ts` as a POST endpoint.

      Request body: `{ domain: string, businessName?: string, industry?: string }`

      SEO checks to perform (in parallel where possible):
      1. PageSpeed Insights API (mobile):
         URL: `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https://${domain}&strategy=mobile`
         Extract: performance score (0-1), FCP, LCP
      2. Fetch `https://${domain}` and parse:
         - `<title>` presence and length (50-60 chars = good)
         - `<meta name="description">` presence and length (150-160 chars = good)
         - `<meta property="og:title">` and `<meta property="og:description">` presence
         - `<link rel="canonical">` presence
         - Structured data: any `<script type="application/ld+json">` present
      3. HTTPS check: domain starts with https (always true if fetch succeeds at https://)

      Scoring algorithm:
        - Performance score from PageSpeed: weight 40% (0-40 pts)
        - Meta completeness: 30% max (title=10, description=10, OG=5, canonical=5)
        - Structured data present: 15 pts
        - HTTPS: 15 pts
        - Total: 0-100

      If PageSpeed API fails (network error or non-200): skip that component,
      redistribute weight (meta: 50%, structured data: 25%, HTTPS: 25%).

      If domain fetch fails entirely: return `{ score: null, error: "domain_unreachable", findings: [] }`

      Response:
      ```json
      {
        "score": 73,
        "findings": [
          "Meta description is missing",
          "No structured data (JSON-LD) detected",
          "PageSpeed mobile score: 68/100"
        ],
        "recommendation": "Add a meta description and implement LocalBusiness schema markup.",
        "domain": "example.com"
      }
      ```

      Timeout: 8 seconds total for all external calls (use Promise.race with AbortController).
      No authentication required on this endpoint (public).
    files_to_create:
      - "app/api/seo-audit/route.ts"
    depends_on: []
    acceptance_criteria:
      - "Returns { score, findings, recommendation, domain } JSON"
      - "Handles PageSpeed API failure gracefully"
      - "Handles unreachable domain gracefully"
      - "Timeout enforced at 8s"
      - "`npm run build` passes"

  - id: "2a-2"
    wave: 3
    title: "Build app/api/ad-health/route.ts — Claude-inferred ad health score"
    model: opus
    complexity: 4
    description: |
      Create `app/api/ad-health/route.ts` as a POST endpoint.

      Request body:
      ```json
      {
        "businessType": "string",
        "industry": "string",
        "topPains": "string",
        "revenue": "string",
        "teamSize": "string"
      }
      ```

      Implementation:
      Use the standard `anthropic` client (claude-sonnet-4-6, NOT ClawRouter —
      this is a diagnostic quality call) to generate an ad health assessment.

      System prompt:
      "You are an ad performance analyst. Given a business profile, assess their
      likely ad health and digital marketing readiness. Return ONLY valid JSON."

      User prompt: structured intake data

      Expected Claude output (enforce with JSON parse):
      ```json
      {
        "score": 45,
        "findings": [
          "No evidence of conversion tracking setup for a business of this type",
          "Revenue range suggests under-investment in paid acquisition",
          "Pain points indicate manual lead follow-up — high ad waste risk"
        ],
        "recommendation": "Implement conversion tracking before scaling ad spend. Focus on retargeting warm leads."
      }
      ```

      Score rubric (Claude should infer):
        - 0-30: Likely no ad presence or significant structural issues
        - 31-60: Ad presence likely but optimization opportunities exist
        - 61-80: Reasonable ad health, targeted improvements needed
        - 81-100: Well-structured campaigns likely

      max_tokens: 400

      Response: forward Claude's JSON directly.
      Error handling: if Claude fails or returns invalid JSON, return
      `{ score: null, findings: [], recommendation: "Ad health assessment unavailable." }`
    files_to_create:
      - "app/api/ad-health/route.ts"
    depends_on: []
    acceptance_criteria:
      - "Returns { score, findings, recommendation } JSON"
      - "Uses claude-sonnet-4-6 (not router)"
      - "Handles Claude failure gracefully"
      - "`npm run build` passes"

  - id: "2b-1"
    wave: 3
    title: "Patch diagnostic route to call seo-audit + ad-health and append report sections"
    model: sonnet
