  - id: T07
    title: "Feature: Email delivery via Resend after run"
    wave: 4
    priority: should
    complexity: 3
    model: sonnet
    depends_on: [T03, T06]
    description: |
      File: lib/email.ts

      import { Resend } from 'resend'
      const resend = new Resend(process.env.RESEND_API_KEY)

      export async function sendRunEmail(params: {
        clientEmail: string
        clientName: string
        agentName: string
        outputSummary: string
        shareToken: string
      }) {
        const shareUrl = `https://os.eevolvv.ai/run/${params.shareToken}`
        await resend.emails.send({
          from: 'eevolvv Intelligence <hello@eevolvv.ai>',
          to: params.clientEmail,
          subject: `${params.agentName} — Your brief is ready`,
          html: `...` // simple HTML: agentName heading, outputSummary paragraph, CTA button linking to shareUrl
        })
      }

      Also check clients table for email field. If missing, add to the T01 migration:
        ALTER TABLE clients ADD COLUMN IF NOT EXISTS email text;

      Integration in execution engine (T03):
      After successful run, if triggeredBy === 'schedule' || triggeredBy === 'share_page':
        - Fetch client email + share_token
        - Call sendRunEmail(...)
        - Fire-and-forget (don't await, don't block response)

      RESEND_API_KEY must be set in Vercel environment variables.
