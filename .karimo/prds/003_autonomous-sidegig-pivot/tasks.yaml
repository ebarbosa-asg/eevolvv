    priority: must
    wave: 2
    depends_on:
      - "T04"
      - "T06"
    acceptance_criteria:
      - "WelcomeEmail.tsx subject: 'Welcome to eevolvv — your [Tier] build is confirmed', includes tier, what happens next (3 steps), eevolvv branding"
      - "OnboardingEmail.tsx subject: 'Complete your onboarding — [Tier] build starts when you do', includes onboarding link /onboard/[token], 5-minute time estimate"
      - "Both templates use react-email components and match eevolvv color system"
      - "lib/email-helpers.ts exports sendWelcomeEmail({ email, name, tier }) and sendOnboardingEmail({ email, name, tier, token })"
      - "Resend from field uses hello@eevolvv.com"
      - "Functions return { success: boolean, error?: string } — do not throw"
    files_affected:
      - "emails/WelcomeEmail.tsx"
      - "emails/OnboardingEmail.tsx"
      - "lib/email-helpers.ts"
    model: sonnet

