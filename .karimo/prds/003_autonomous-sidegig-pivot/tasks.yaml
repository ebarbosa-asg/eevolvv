prd: autonomous-sidegig-pivot
version: "1.0"
created: "2026-05-06"

tasks:
  - id: "T01"
    title: "Stripe Foundation"
    description: "Install stripe npm package, create lib/stripe.ts as a singleton Stripe client initialized with STRIPE_SECRET_KEY, and document all required environment variables in .env.example."
    complexity: 2
    priority: must
    wave: 1
    depends_on: []
    acceptance_criteria:
      - "stripe package installed and importable"
      - "lib/stripe.ts exports an initialized Stripe client using STRIPE_SECRET_KEY"
      - ".env.example updated with STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY, and all 6 price ID vars"
    files_affected:
      - "lib/stripe.ts"
      - "package.json"
      - ".env.example"
    model: sonnet

  - id: "T02"
    title: "Stripe Billing Setup"
    description: "Create 6 Stripe Products and Prices: Seed Monthly ($99), Seed Annual ($950), Core Monthly ($499), Core Annual ($4,790), Evolve Monthly ($1,999), Evolve Annual ($19,190). Document all price IDs in lib/stripe-prices.ts as typed constants and in .env.example as env vars."
    complexity: 2
    priority: must
    wave: 1
    depends_on:
      - "T01"
    acceptance_criteria:
      - "6 products exist in Stripe dashboard with correct names and prices"
      - "lib/stripe-prices.ts exports typed constants mapping tier + interval to price ID"
      - "All price IDs are env-var driven so staging and prod can differ"
      - "Annual prices reflect 2 months free discount vs monthly rate"
    files_affected:
      - "lib/stripe-prices.ts"
      - ".env.example"
    model: sonnet

  - id: "T03"
    title: "Checkout API Route"
    description: "Build app/api/stripe/checkout/route.ts — a POST endpoint accepting { priceId, email }, creating a Stripe Checkout Session with mode: 'subscription', and returning { url } for client-side redirect."
    complexity: 3
    priority: must
    wave: 2
    depends_on:
      - "T01"
      - "T02"
    acceptance_criteria:
      - "POST /api/stripe/checkout accepts { priceId, email } body"
      - "Creates Stripe Checkout Session with correct success_url and cancel_url"
      - "success_url includes {CHECKOUT_SESSION_ID} for post-payment verification"
      - "Returns { url } for frontend redirect"
      - "Handles Stripe errors with appropriate HTTP status codes"
      - "customer_email pre-filled from request body"
    files_affected:
      - "app/api/stripe/checkout/route.ts"
    model: sonnet

  - id: "T04"
    title: "Webhook Handler"
    description: "Build app/api/stripe/webhook/route.ts — verifies Stripe webhook signature using raw body, routes events to typed handler functions. Initial events: checkout.session.completed, invoice.payment_succeeded, invoice.payment_failed, customer.subscription.updated, customer.subscription.deleted."
    complexity: 4
    priority: must
    wave: 2
    depends_on:
      - "T01"
      - "T05"
    acceptance_criteria:
      - "Stripe webhook signature verification using STRIPE_WEBHOOK_SECRET"
      - "Raw body parsing (not JSON — Stripe requires raw body for signature)"
      - "Event router dispatches to typed handler functions"
      - "checkout.session.completed handler calls createClientRecord() implemented in T06"
      - "invoice.payment_succeeded handler updates subscriptions.status to active"
      - "Unhandled events return 200 (Stripe requirement)"
      - "Failed handler does NOT throw — logs error and returns 200"
    files_affected:
      - "app/api/stripe/webhook/route.ts"
      - "lib/webhook-handlers.ts"
    model: sonnet

  - id: "T05"
    title: "Supabase Migration 006"
    description: "Create supabase/migrations/006_subscriptions_builds.sql defining 4 new tables: clients, subscriptions, builds, onboarding_tokens. Include RLS policies granting service role full access and no anon access."
    complexity: 4
    priority: must
    wave: 1
    depends_on: []
    acceptance_criteria:
      - "clients table: id, email, name, tier, stripe_customer_id, churn_risk (boolean), created_at"
      - "subscriptions table: id, client_id (FK to clients), stripe_subscription_id, stripe_price_id, status, current_period_end, cancel_at_period_end, created_at"
      - "builds table: id, client_id (FK to clients), tier, status (queued|in_progress|qa|deploying|live), assigned_to, build_url, notes, started_at, completed_at, created_at"
      - "onboarding_tokens table: id, client_id (FK to clients), token (uuid), completed_at, expires_at, created_at"
      - "RLS: service role full access, anon no access"
      - "Migration runs without error on existing Supabase project"
    files_affected:
      - "supabase/migrations/006_subscriptions_builds.sql"
    model: sonnet

  - id: "T06"
    title: "Webhook → Client Creation + Onboarding Trigger"
    description: "Implement createClientRecord() in lib/webhook-handlers.ts. On checkout.session.completed: create client record in clients table, create subscriptions record, generate UUID onboarding token in onboarding_tokens (30-day expiry), and call sendWelcomeEmail() and sendOnboardingEmail(). Entire operation must be idempotent and wrapped in try/catch."
    complexity: 5
    priority: must
    wave: 3
    depends_on:
      - "T04"
      - "T05"
    acceptance_criteria:
      - "Idempotent — second call for same session ID is a no-op (check stripe_subscription_id uniqueness)"
      - "Creates clients record with email, tier derived from price ID, Stripe customer ID"
      - "Creates subscriptions record with correct status and billing interval"
      - "Generates cryptographically random UUID token inserted into onboarding_tokens with 30-day expiry"
      - "Calls sendWelcomeEmail() and sendOnboardingEmail() with token"
      - "Entire operation wrapped in try/catch — failure logged, not thrown"
    files_affected:
      - "lib/webhook-handlers.ts"
      - "lib/supabase.ts"
    model: opus

  - id: "T07"
    title: "Payment Wall in ChatEngine.tsx"
    description: "Replace the Calendly CTA at ~line 499 of components/ChatEngine.tsx with inline tier selection cards (Seed, Core, Evolve) that route to Stripe Checkout via /api/stripe/checkout. Monthly/Annual toggle with annual as default. Matches eevolvv design system."
    complexity: 4
    priority: must
    wave: 2
    depends_on:
      - "T02"
      - "T03"
    acceptance_criteria:
      - "Payment wall appears after report is delivered in the conversation"
      - "Three tier cards: Seed ($99/mo or $950/yr), Core ($499/mo or $4,790/yr), Evolve ($1,999/mo or $19,190/yr)"
      - "Monthly/Annual toggle present with annual as the default selected state"
      - "Each card includes: tier name, price, 3-line feature summary, CTA button"
      - "Clicking CTA calls POST /api/stripe/checkout with correct priceId and user email from chat"
      - "On success, redirects to Stripe-hosted Checkout"
      - "Loading state shown during API call"
      - "Error state shown if API fails"
      - "Uses components/ds/ — no raw Tailwind classes"
    files_affected:
      - "components/ChatEngine.tsx"
      - "components/TierCards.tsx"
    model: sonnet

  - id: "T08"
    title: "Welcome Email Template + Webhook Trigger"
    description: "Create emails/WelcomeEmail.tsx and emails/OnboardingEmail.tsx react-email templates. Implement sendWelcomeEmail() and sendOnboardingEmail() helpers in lib/email-helpers.ts using Resend. Both functions return { success, error } and do not throw."
