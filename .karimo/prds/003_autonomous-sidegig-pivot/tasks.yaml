  - id: "T12"
    title: "3-Email Follow-Up Sequence + Cron"
    description: "Build a post-diagnostic follow-up sequence for unconverted leads. Vercel cron runs daily at 9am, checks for submissions without a matching clients record, and sends up to 3 follow-up emails at 24h, 72h, and 7-day intervals. Sequence stops on conversion."
    complexity: 4
    priority: should
    wave: 3
    depends_on:
      - "T08"
    acceptance_criteria:
      - "FollowUp1.tsx (24h): highlights top 3 opportunities from report, links to pricing"
      - "FollowUp2.tsx (72h): personalized based on diagnostic answers, softer CTA"
      - "FollowUp3.tsx (7d): urgency framing, pricing link"
      - "Vercel cron at 0 9 * * * queries submissions table for unconverted leads"
      - "Follow-up state tracked in submissions table via followup_sent_at[] column"
      - "Sequence stops if lead email found in clients table"
      - "Unsubscribe link included in all emails"
    files_affected:
      - "emails/FollowUp1.tsx"
      - "emails/FollowUp2.tsx"
      - "emails/FollowUp3.tsx"
      - "app/api/cron/followup/route.ts"
      - "supabase/migrations/007_followup_tracking.sql"
      - "vercel.json"
