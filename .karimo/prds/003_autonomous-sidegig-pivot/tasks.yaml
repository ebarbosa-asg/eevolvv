  - id: "T14"
    title: "Rate Limiter Upgrade (Subscription-Aware)"
    description: "Upgrade lib/rateLimit.ts to be subscription-aware. Active subscribers get unlimited rate; free users keep existing 3/hr IP limit. checkRateLimit() accepts optional clientId, queries subscriptions table if provided."
    complexity: 3
    priority: should
    wave: 3
    depends_on:
      - "T05"
    acceptance_criteria:
      - "checkRateLimit() accepts optional clientId parameter"
      - "If clientId provided: queries subscriptions table; if status active returns { allowed: true, limit: null }"
