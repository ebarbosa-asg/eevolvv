  - id: "T24"
    title: "PostHog Funnel Tracking"
    description: "Instrument the full conversion funnel with posthog.capture() calls at 8 key events: diagnostic_started, report_generated, payment_wall_viewed, tier_selected, checkout_completed, onboarding_completed, build_started, build_live. Server-side events use PostHog Node.js client. No PII in event properties."
