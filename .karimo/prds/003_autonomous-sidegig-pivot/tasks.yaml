      - "app/api/diagnostic/route.ts updated to pass client ID from session/cookie if present"
      - "Graceful fallback: if Supabase query fails, falls back to IP-based limit"
    files_affected:
      - "lib/rateLimit.ts"
      - "app/api/diagnostic/route.ts"
