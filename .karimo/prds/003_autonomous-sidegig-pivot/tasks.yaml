  - id: "T22"
    title: "Churn Risk Detection Cron"
    description: "Build a Vercel cron at 0 9 * * 1 (Monday 9am) that checks three churn signals: no onboarding >7 days, no portal visit >30 days, approaching renewal with low engagement. Flags at-risk clients in DB and sends internal OS alert to hello@eevolvv.com."
    complexity: 3
    priority: should
    wave: 4
    depends_on:
      - "T05"
      - "T06"
      - "T09"
      - "T15"
    acceptance_criteria:
      - "Vercel cron at 0 9 * * 1 triggers app/api/cron/churn-detection/route.ts"
      - "Signal 1: onboarding not completed >7 days post-payment (onboarding_tokens.completed_at IS NULL AND clients.created_at < NOW() - INTERVAL '7 days')"
      - "Signal 2: no client portal visit >30 days (clients.last_portal_visit_at is older than 30 days)"
      - "Signal 3: subscription renewing within 7 days with last_portal_visit_at older than 14 days"
      - "Matching clients: UPDATE clients SET churn_risk = true"
      - "Sends internal alert email to hello@eevolvv.com listing at-risk clients with triggering signal"
      - "Cron route protected by CRON_SECRET"
      - "clients table has last_portal_visit_at column (via migration 008)"
    files_affected:
      - "app/api/cron/churn-detection/route.ts"
      - "app/client/[token]/page.tsx"
      - "supabase/migrations/008_churn_tracking.sql"
      - "vercel.json"
    model: sonnet

