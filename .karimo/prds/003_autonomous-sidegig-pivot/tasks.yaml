  - id: "T11"
    title: "Homepage Pricing Section Update"
    description: "Update the pricing section in app/page.tsx to reflect the subscription model. Replace existing pricing content with Seed/Core/Evolve tiers at annual pricing, with CTAs routing to /pricing page."
