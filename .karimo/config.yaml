# KARIMO Configuration — eevolvv
# Generated by /karimo:configure

config_version: "2.0"
mode: full

project:
  name: "eevolvv"
  runtime: "Node.js 25"
  framework: "Next.js"
  package_manager: "npm"

commands:
  build: "npm run build"
  lint: "npm run lint"
  test: null
  typecheck: null

boundaries:
  never_touch:
    - "node_modules/**"
    - ".next/**"
    - "out/**"
    - "*.lock"
    - "package-lock.json"
    - ".env*"
    - ".vercel/**"
    - "tsconfig.tsbuildinfo"
  require_review:
    - "package.json"
    - "next.config.js"
    - "tsconfig.json"
    - "app/api/**"
    - "lib/supabase.ts"
    - "lib/rateLimit.ts"
    - "middleware.ts"

github:
  owner_type: "user"
  owner: "ebarbosa-asg"
  repository: "eevolvv"
  merge_strategy: "squash"

execution:
  default_model: "sonnet"
  max_parallel_tasks: 3
  pre_pr_checks:
    - "build"
    - "lint"

cost:
  escalate_after_failures: 1
  max_attempts: 3

review:
  enabled: false
  provider: null
  threshold: 5
  max_revision_loops: 3
  none_behavior: manual
  pre_execution_prompt: true

cd:
  provider: vercel
  status: configured
  pattern: "^feature/|-[0-9]+[a-z]?$"
  configured_at: "2026-05-02T00:00:00Z"
